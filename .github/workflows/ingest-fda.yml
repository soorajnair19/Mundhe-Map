name: Daily FDA ingest

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: How many days of news to scan
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Ingest FDA reports
        env:
          INGEST_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '2' }}
        run: npm run ingest-fda -- --lookback-days=${{ github.event.inputs.lookback_days || 2 }}
      - name: Commit living ledger if it grew
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/admin/pending-fda-reports.json
          if git diff --cached --quiet; then
            echo "No new FDA reports"
          else
            git commit -m "ingest: append FDA reports from public news RSS"
            # Retry push with pull --rebase in case main moved
            for i in 1 2 3; do
              git push && break
              echo "Push failed, pulling and retrying ($i/3)..."
              git pull --rebase origin main
            done
          fi
